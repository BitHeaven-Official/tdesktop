name: Linux Musl

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - 'snap/**'
      - 'Telegram/build/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - 'snap/**'
      - 'Telegram/build/**'

jobs:
  linux:
    name: Alpine Linux (musl)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Alpine dependencies via Docker
        run: |
          docker pull alpine:3.20
          mkdir -p build-musl
          docker run --rm -v $PWD:/src -w /src alpine:3.20 sh -c "
            apk add --no-cache \
              git cmake ninja build-base clang clang-dev \
              qt6-qtbase-dev qt6-qtimageformats-dev qt6-qtsvg-dev qt6-qt5compat-dev \
              ffmpeg-dev openal-soft-dev protobuf-dev openssl-dev zlib-dev \
              libx11-dev libxrandr-dev libxcomposite-dev libxdamage-dev \
              libxfixes-dev libxext-dev libxrender-dev mesa-dev \
              wayland-dev wayland-protocols linux-headers \
              python3 py3-pip \
              curl && \
            pip install --no-cache-dir poetry && \
            git submodule update --init --recursive
          "

      - name: Configure musl build
        run: |
          docker run --rm -v $PWD:/src -w /src alpine:3.20 sh -c "
            mkdir -p build-musl && cd build-musl && \
            cmake ../Telegram \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DDESKTOP_APP_USE_PACKAGED=OFF \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++
          "

      - name: Build Telegram Desktop (musl)
        run: |
          docker run --rm -v $PWD:/src -w /src/build-musl alpine:3.20 sh -c "
            ninja
          "

      - name: Check binary
        run: |
          file build-musl/Telegram
          if [ ! -f build-musl/Telegram ]; then
            echo 'Build failed, Telegram binary not found'
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Telegram-musl
          path: build-musl/Telegram
